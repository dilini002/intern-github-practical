
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intern Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Intern Task Manager</h1>

        <h2>Intern Name: BMDM Batagoda</h2>
        <p>Registration Number : AMP/IT/2324/F/002</p>
        <p>Technology : HTML, CSS, JavaScript</p>
        <p>Start Date : 01st October 2026</p>

        <div class="task-input">
            <input type="text" id="taskInput" placeholder="Enter a task">
            <button onclick="addTask()">Add Task</button>
        </div>

        <div class="dashboard">
            <h2>Dashboard</h2>
            <p>Total Tasks: <span id="totalTasks">0</span></p>
            <p>Completed Tasks: <span id="completedTasks">0</span></p>
            <p>Pending Tasks: <span id="pendingTasks">0</span></p>
        </div>

        <h2>Task List</h2>
        <ul id="taskList"></ul>


        <h2>Completed Tasks</h2>
        <ul id="completedList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
